name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-dirs:
    name: Discover contract directories
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: dirs
        run: |
          dirs=$(find contracts/contracts -type f -name 'Makefile' -mindepth 2 | xargs dirname | sed 's|^\./||' | jq -Rnc '[inputs | "\(.)"]')
          echo "dirs=$dirs" >> $GITHUB_OUTPUT

  contracts:
    name: Build ${{ matrix.contract }}
    needs: contract-dirs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.contract-dirs.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4

      - uses: stellar/actions/rust-cache@main

      - name: Install Rust toolchain
        run: |
          rustup update
          rustup target add wasm32v1-none

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: stellar/stellar-cli@v23.1.1

      - name: Build contract
        run: stellar contract build

      - name: Run contract tests
        run: cargo test

  agent:
    name: Run Python test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  zkml:
    name: ZK prover tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zkml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zkml/package-lock.json

      - name: Install npm dependencies
        run: npm install

      - name: Run prover tests
        run: npm test

  agent-ts:
    name: Build TypeScript agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install npm dependencies
        run: npm install

      - name: Typecheck
        run: npm run build

      - name: Run unit tests
        run: npm test
